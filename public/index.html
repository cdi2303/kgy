<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CronWatch — PoC</title>
<style>
  :root { --bg:#0f1115; --card:#191c23; --line:#2a2f3a; --fg:#e6e8ec; --mut:#8b93a1; --up:#3fb950; --down:#f85149; --new:#d29922; --pause:#6e7681; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  h1 { font-size:18px; margin:0; }
  .mut { color:var(--mut); }
  main { padding:24px; max-width:980px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  form { display:grid; grid-template-columns:1fr 130px 130px 1fr auto; gap:10px; align-items:end; }
  label { display:block; font-size:12px; color:var(--mut); margin-bottom:4px; }
  input { width:100%; padding:8px 10px; background:#0f1115; border:1px solid var(--line); border-radius:6px; color:var(--fg); }
  button { padding:8px 14px; background:#2563eb; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--mut); font-weight:400; padding:4px 10px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mut); font-weight:600; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .s-up{background:rgba(63,185,80,.15);color:var(--up)} .s-down{background:rgba(248,81,73,.15);color:var(--down)}
  .s-new{background:rgba(210,153,34,.15);color:var(--new)} .s-paused{background:rgba(110,118,129,.15);color:var(--pause)}
  code { background:#0f1115; padding:2px 6px; border-radius:5px; font-size:12px; word-break:break-all; }
  .row-actions { display:flex; gap:6px; }
  @media(max-width:760px){ form{grid-template-columns:1fr 1fr} }
</style>

<header>
  <h1>CronWatch</h1>
  <span class="mut">cron/batch dead man's switch — PoC</span>
</header>

<main>
  <div class="card">
    <form id="createForm">
      <div><label>Name</label><input name="name" placeholder="nightly-backup" required></div>
      <div><label>Period (sec)</label><input name="period_seconds" type="number" value="60" min="1" required></div>
      <div><label>Grace (sec)</label><input name="grace_seconds" type="number" value="30" min="0"></div>
      <div><label>Webhook URL (optional)</label><input name="webhook_url" placeholder="https://hooks.slack..."></div>
      <button type="submit">Add check</button>
    </form>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Status</th><th>Name</th><th>Ping URL</th><th>Last ping</th><th>Period</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="mut">loading…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (ms) => ms ? new Date(ms).toLocaleString() : '—';

async function load() {
  const checks = await (await fetch('/api/checks')).json();
  const rows = $('#rows');
  if (!checks.length) { rows.innerHTML = '<tr><td colspan="6" class="mut">no checks yet</td></tr>'; return; }
  rows.innerHTML = checks.map(c => `
    <tr>
      <td><span class="pill s-${c.status}">${c.status}</span></td>
      <td>${escapeHtml(c.name)}</td>
      <td><code>${c.ping_url}</code></td>
      <td>${fmt(c.last_ping_at)}</td>
      <td>${c.period_seconds}s +${c.grace_seconds}s</td>
      <td class="row-actions">
        ${c.status === 'paused'
          ? `<button class="ghost" data-act="resume" data-id="${c.id}">resume</button>`
          : `<button class="ghost" data-act="pause" data-id="${c.id}">pause</button>`}
        <button class="ghost" data-act="delete" data-id="${c.id}">delete</button>
      </td>
    </tr>`).join('');
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

$('#createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = {
    name: f.name.value.trim(),
    period_seconds: Number(f.period_seconds.value),
    grace_seconds: Number(f.grace_seconds.value),
    webhook_url: f.webhook_url.value.trim() || undefined,
  };
  const res = await fetch('/api/checks', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!res.ok) { alert((await res.json()).error || 'error'); return; }
  f.reset(); f.period_seconds.value = 60; f.grace_seconds.value = 30;
  load();
});

$('#rows').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const { act, id } = btn.dataset;
  if (act === 'delete') { if (!confirm('Delete this check?')) return; await fetch('/api/checks/'+id, {method:'DELETE'}); }
  else await fetch(`/api/checks/${id}/${act}`, {method:'POST'});
  load();
});

load();
setInterval(load, 5000);
</script>
